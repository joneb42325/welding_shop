<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wolfram Shop</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header"></header>
    <main class="main">
      <aside class="sidebar">
        <div class="cart-box">
          <h3>Корзина</h3>
          <p>Товарів: <span id="cart-count">0</span></p>
          <p>Сума: <span id="cart-total">0</span> грн</p>
          <a href="cart.html">
            <button>Оформити замовлення</button>
          </a>
        </div>

        <div class="catalog">
          <h3>Каталог</h3>
          <ul id="catalog-list"></ul>
        </div>
      </aside>
      <div class="content">
        <section class="product-header">
          <div class="product-info">
            <h1 id="product-name"></h1>
            <p id="product-description"></p>
          </div>
          <img id="product-image" src="" alt="" />
        </section>
        <section class="product-prices">
          <div id="manufacturer-tables" class="catalog-grid"></div>
        </section>
      </div>
    </main>

    <footer class="footer"></footer>

    <script type="module">
      import { injectHeader, injectFooter } from './layouts.js';
      injectHeader();
      injectFooter();
    </script>

    <script type="module" src="script.js"></script>
    <script type="module" src="product.js"></script>
  </body>
</html>
