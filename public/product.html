<!doctype html>
<html lang="uk">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X4VLDJJ2XJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-X4VLDJJ2XJ');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wolfram Shop</title>
    <meta name="description" content="Зварювальні матеріали високої якості." />
    <link rel="icon" type="image/png" href="images/logo.webp" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="header"></header>
    <main class="main">
      <aside class="sidebar">
        <div class="cart-box">
          <h3>🛒 Кошик</h3>
          <p>Товарів: <span id="cart-count">0</span></p>
          <p>Сума: <span id="cart-total">0</span> грн</p>
          <a href="cart.html">
            <button>Оформити замовлення</button>
          </a>
        </div>

        <div class="catalog">
          <h3>🗂️ Каталог</h3>
          <ul id="catalog-list"></ul>
        </div>
      </aside>
      <div class="content">
        <section class="product-header">
          <div class="product-info">
            <h1 id="product-name"></h1>
            <img id="product-image" src="" alt="" />
          </div>
        </section>
        <section class="product-prices">
          <div id="manufacturer-tables" class="catalog-grid"></div>
        </section>
        <section class="product-description">
          <p id="product-description"></p>
        </section>
      </div>
    </main>

    <footer class="footer"></footer>

    <script type="module">
      import { injectHeader, injectFooter } from './js/layouts.js';
      injectHeader();
      injectFooter();
    </script>

    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/product.js"></script>
  </body>
</html>
