<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Товари</title>
    <link rel="icon" type="image/png" href="/images/logo.webp" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <div class="admin-container">
      <h2 id="page-title"></h2>

      <div class="admin-actions">
        <a href="product-add.html"><button>Додати товар</button></a>
        <button id="save-order-btn" class="secondary-btn">Зберегти порядок</button>
        <button id="save-prices-btn" class="secondary-btn" style="background-color: #27ae60; color: white;">
           Зберегти ціни
        </button>
        <a href="index.html"><button class="secondary-btn">На головну</button></a>
      </div>

      <div class="bulk-actions" style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #ddd;">
        <span style="font-weight: bold;">Масові дії:</span>
        <select id="bulk-action-type" style="padding: 6px;">
          <option value="price_add_abs">Збільшити ціни на (грн)</option>
          <option value="price_sub_abs">Зменшити ціни на (грн)</option>
          <option value="price_add_percent">Збільшити ціни на (%)</option>
          <option value="price_sub_percent">Зменшити ціни на (%)</option>
          <option value="delete">Видалити обрані</option>
        </select>

        <input type="number" id="bulk-action-val" placeholder="Значення (напр. 10)" step="0.01" style="width: 140px; padding: 5px;">

        <button id="apply-bulk-btn" class="secondary-btn" style="background-color: #e67e22; color: white;">Застосувати</button>
      </div>

      <table id="products-table">
        <thead>
          <tr>
            <th><input type="checkbox" id="select-all" /></th>
            <th>Назва</th>
            <th>Фото</th>
            <th>Категорія</th>
            <th>Опис</th>
            <th>Роздріб</th>
            <th>ФОП</th>
            <th>Опт</th>
            <th>Склад</th>
            <th>Поріг опту</th>
            <th>Акція</th>
            <th>Порядок</th>
            <th>Дії</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <script type="module" src="js/products.js"></script>
  </body>
</html>
