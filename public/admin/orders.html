<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Замовлення</title>
    <link rel="icon" type="image/png" href="/images/logo.webp" />
    <link rel="stylesheet" href="css/admin.css" />
    <style></style>
  </head>
  <body>
    <div class="admin-container">
      <h2>Замовлення</h2>
      <div class="admin-actions">
        <a href="index.html"><button class="secondary-btn">На головну</button></a>
      </div>

      <table id="orders-table">
        <thead>
          <tr>
            <th>№</th>
            <th>Клієнт</th>
            <th>Контакти</th>
            <th>Доставка</th>
            <th>Сума</th>
            <th>Статус</th>
            <th>Дії</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="items-modal" class="modal">
      <div class="modal-content modal-large">
        <span class="close-modal">&times;</span>
        <h3>Товари замовлення №<span id="modal-order-id"></span></h3>
        <p id="modal-comment-view">
          <strong>Коментар клієнта:</strong>
          <span id="modal-comment"></span>
        </p>

        <!-- Поля редактирования заказа -->
        <div id="modal-edit-fields" hidden>
          <h3>Дані замовлення</h3>

          <label for="edit-customer-name">Ім'я клієнта</label>
          <input id="edit-customer-name" type="text" required>

          <label for="edit-customer-phone">Телефон</label>
          <input id="edit-customer-phone" type="text" required>

          <label for="edit-customer-email">Email</label>
          <input id="edit-customer-email" type="email">

          <label for="edit-delivery-address">Адреса доставки</label>
          <input id="edit-delivery-address" type="text">

          <label for="edit-comment">Коментар</label>
          <textarea id="edit-comment"></textarea>
        </div>

        <table>
          <thead>
            <tr>
              <th>Назва</th>
              <th>Опції</th>
              <th>Тип ціни</th>
              <th>Ціна х Кіл-ть</th>
              <th>Сума</th>
            </tr>
          </thead>
          <tbody id="modal-items-body"></tbody>
        </table>

        <div id="modal-edit-actions" hidden>
          <button type="button" id="save-order-btn">
            Зберегти зміни
          </button>

          <button type="button" id="cancel-edit-btn">
            Скасувати
          </button>
        </div>

      </div>
    </div>

    <script src="js/orders.js"></script>
  </body>
</html>
