<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Додати товар</title>
    <link rel="icon" type="image/png" href="/images/logo.webp" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <div class="admin-container">
      <h2>Додати новий товар</h2>

      <form id="product-form" enctype="multipart/form-data">
        <div class="form-group">
          <label>Назва товару</label>
          <input type="text" name="name" required />
        </div>

        <div class="form-group">
          <label>Категорія</label>
          <select name="category_id" id="category-select" required>
            <option value="">Завантаження категорій...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Виробник</label>
          <select name="manufacturer_id" id="manufacturer-select" required>
            <option value="">Завантаження виробників...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Діаметр (напр. 3.0 мм)</label>
          <input type="text" name="diameter" required />
        </div>

        <div class="form-group">
          <label>Вага (напр. 2.5 кг)</label>
          <input type="text" name="weight" />
        </div>

        <div class="form-group">
          <label>Ціна роздріб (грн)</label>
          <input type="number" name="price_retail" step="0.01" required />
        </div>

        <div class="form-group">
          <label>Ціна ФОП (грн)</label>
          <input type="number" name="price_company" step="0.01" />
        </div>

        <div class="form-group">
          <label>Ціна опт (грн)</label>
          <input type="number" name="price_wholesale" step="0.01" />
        </div>

        <div class="form-group">
          <label for="unit">Ціна за:</label>
          <select id="unit" name="unit">
            <option value="шт">шт (штуки)</option>
            <option value="кг">кг (кілограми)</option>
            <option value="пач">пач (пачки)</option>
            <option value="м">м (метри)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Поріг опту (від скількох штук)</label>
          <input
            type="number"
            name="wholesale_threshold"
            value="50"
            min="2"
            step="1"
            placeholder="Наприклад: 50"
          />
        </div>

        <div class="form-group">
          <label>Кількість на складі</label>
          <input type="number" name="stock" value="100" />
        </div>

        <div class="form-group">
          <label>Опис</label>
          <textarea name="description" rows="5"></textarea>
        </div>

        <div class="form-group checkbox-group">
          <label>
            <span>Спеціальна пропозиція (на головну)</span>
            <input type="checkbox" name="is_special" value="1" />
          </label>
        </div>

        <div class="form-group checkbox-group">
          <label>
            <span>Розраховувати ціну від об'єму (порізка від 1 кг)</span>
            <input type="checkbox" name="has_dynamic_pricing" id="has_dynamic_pricing" value="true" />
          </label>
        </div>

        <div class="form-group checkbox-group">
          <label>
          <span>Це оптовий товар (бухта / палета 50+ кг)</span>
            <input type="checkbox" id="is_wholesale" name="is_wholesale" value="1" />
            <small>
              Якщо позначено, товар продається цілою упаковкою за оптовою ціною, а роздрібні знижки від об'єму вимикаються.
            </small>
          </label>
        </div>

        <!-- Новий блок з налаштуваннями формули -->
        <div id="dynamic-pricing-settings" style="display: none; border: 1px solid #ddd; padding: 15px; margin-top: 10px; border-radius: 8px;">
          <h4 style="margin-top:0;">Налаштування формули об'єму</h4>
          <div class="form-group">
            <label>Знижка 1-5 кг (базовий роздріб, напр. 0%)</label>
            <input type="number" step="0.01" min="0" max="1" id="markup_tier1" name="markup_tier1" value="0" placeholder="0.00" />
          </div>
          <div class="form-group">
            <label>Знижка 5-10 кг (напр. 0.15 = 15% знижки)</label>
            <input type="number" step="0.01" min="0" max="1" id="markup_tier2" name="markup_tier2" value="0.15" placeholder="0.15" />
          </div>
          <div class="form-group">
            <label>Знижка 10-поріг опту кг (напр. 0.3 = 30% знижки)</label>
            <input type="number" step="0.01" min="0" max="1" id="markup_tier3" name="markup_tier3" value="0.3" placeholder="0.3" />
          </div>
          <div class="form-group">
            <label>Вартість порізки (грн)</label>
            <input type="number" id="cut_fee" name="cut_fee" value="40" />
          </div>
        </div>

        <div class="form-group">
          <label>Зображення</label>
          <input type="file" id="image-input" name="image" required />
        </div>

        <div class="form-group">
          <img id="preview" class="hidden" style="max-width: 200px" />
        </div>

        <button type="submit">Зберегти товар</button>
        <a href="products.html"><button type="button">Назад</button></a>
      </form>
    </div>
    <script src="js/product-add.js"></script>
  </body>
</html>
