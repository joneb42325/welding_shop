<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Редагувати товар</title>
    <link rel="icon" type="image/png" href="/images/logo.webp" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="admin-container">
      <h2>Редагування товару</h2>

      <div class="current-info">
        <div class="current-image-wrapper">
          <strong>Поточне зображення:</strong><br />
          <img id="current-image" class="hidden" alt="Поточне зображення" />
        </div>
      </div>

      <form id="edit-product-form" enctype="multipart/form-data">
        <div class="form-group">
          <label>Назва товару</label>
          <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
          <label>Категорія</label>
          <select id="category-select" name="category_id" required>
            <option value="">Завантаження категорій...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Виробник</label>
          <select id="manufacturer-select" name="manufacturer_id" required>
            <option value="">Завантаження виробників...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Діаметр (напр. 3.0 мм)</label>
          <input type="text" id="diameter" name="diameter" required />
        </div>

        <div class="form-group">
          <label>Вага (напр. 2.5 кг)</label>
          <input type="text" id="weight" name="weight" />
        </div>

        <div class="form-group">
          <label>Ціна роздріб (грн)</label>
          <input type="number" id="price_retail" name="price_retail" step="0.01" required />
        </div>

        <div class="form-group">
          <label>Ціна ТОВ (грн)</label>
          <input type="number" id="price_company" name="price_company" step="0.01" />
        </div>

        <div class="form-group">
          <label>Ціна опт (грн)</label>
          <input type="number" id="price_wholesale" name="price_wholesale" step="0.01" />
        </div>

        <div class="form-group">
          <label>Кількість на складі</label>
          <input type="number" id="stock" name="stock" />
        </div>

        <div class="form-group">
          <label>Опис</label>
          <textarea id="description" name="description" rows="5"></textarea>
        </div>

        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" id="is_special" name="is_special" value="1" />
            Спеціальна пропозиція (на головну)
          </label>
        </div>

        <div class="form-group">
          <label>Зображення (залиште порожнім, щоб не змінювати)</label>
          <input type="file" id="image-input" name="image" />
          <img id="preview" class="hidden" />
        </div>

        <div class="form-buttons">
          <button type="submit" class="save-btn">Зберегти зміни</button>
          <a href="products.html">
            <button type="button" class="cancel-btn">Скасувати</button>
          </a>
        </div>
      </form>
    </div>

    <script src="product-edit.js"></script>
  </body>
</html>
