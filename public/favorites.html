<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Обрані товари | Wolfram Shop</title>
    <link rel="icon" type="image/png" href="images/logo.webp" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="header"></header>

    <main class="main">
      <aside class="sidebar">
        <div class="cart-box">
          <h3>🛒 Кошик</h3>
          <p>Товарів: <span id="cart-count">0</span></p>
          <p>Сума: <span id="cart-total">0</span> грн</p>
          <a href="cart.html"><button>Оформити замовлення</button></a>
        </div>
        <div class="catalog">
          <h3>🗂️ Каталог</h3>
          <ul id="catalog-list"></ul>
        </div>
      </aside>

      <div class="content">
        <h2>Ваші обрані товари</h2>
        <div id="favorites-container" class="catalog-grid"></div>

        <div id="empty-favorites" class="empty-state-wrapper" style="display: none">
          <div class="empty-message">
            <h2>Ви ще нічого не додали в обране 🤍</h2>
            <p>Перейдіть до каталогу, щоб знайти потрібні зварювальні матеріали.</p>
            <a href="index.html" class="btn-back">Перейти до покупок</a>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer"></footer>

    <script type="module">
      import { injectHeader, injectFooter } from './js/layouts.js';
      injectHeader();
      injectFooter();
    </script>
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/favorites-page.js"></script>
  </body>
</html>
