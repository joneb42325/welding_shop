<!doctype html>
<html lang="uk">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X4VLDJJ2XJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-X4VLDJJ2XJ');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wolfram Shop — Професійні зварювальні матеріали та електроди</title>
    <meta
      name="description"
      content="Інтернет-магазин Wolfram: найкращі зварювальні електроди, дріт та металопрокат у Харкові та Україні. Гуртові ціни та швидка доставка."
    />
    <link rel="icon" type="image/png" href="images/logo.webp" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header"></header>
    <main class="main">
      <aside class="sidebar">
        <div class="cart-box">
          <h2>🛒 Кошик</h2>
          <p>Товарів: <span id="cart-count">0</span></p>
          <p>Сума: <span id="cart-total">0</span> грн</p>
          <a href="cart.html">
            <button>Оформити замовлення</button>
          </a>
        </div>

        <div class="catalog">
          <h2>🗂️ Каталог</h2>
          <ul id="catalog-list"></ul>
        </div>
      </aside>
      <div class="content">
        <section class="special-banner">
          <div class="special-banner-content">
            <h1>Професійні зварювальні матеріали</h1>
            <p>Найкращі електроди та дріт для будь-яких задач</p>
            <a href="#catalog-container" class="banner-btn">Перейти до каталогу</a>
          </div>
        </section>
        <h2>Спеціальні пропозиції Wolfram</h2>
        <div id="special-products-container"></div>
        <h2>Каталог продукції</h2>
        <section class="catalog-preview">
          <div id="catalog-container" class="catalog-grid"></div>
        </section>
      </div>
    </main>

    <footer class="footer"></footer>
    <script type="module">
      import { injectHeader, injectFooter } from './layouts.js';
      injectHeader();
      injectFooter();
    </script>
    <script type="module" src="script.js"></script>
    <script type="module" src="home-page.js"></script>
  </body>
</html>
