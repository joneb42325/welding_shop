<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Результати пошуку — Wolfram Shop</title>
    <link rel="icon" type="image/png" href="images/logo.webp" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header"></header>

    <main class="main">
      <aside class="sidebar"></aside>

      <div class="content">
        <div class="search-page-header">
          <h2 id="search-title">Результати пошуку</h2>

          <div id="sort-container" class="sort-container">
            <label for="search-sort">Сортувати:</label>
            <select id="search-sort">
              <option value="default">За релевантністю</option>
              <option value="price-asc">Спочатку дешевші 📈</option>
              <option value="price-desc">Спочатку дорожчі 📉</option>
            </select>
          </div>
        </div>
        <div id="search-results-container" class="catalog-grid">
          <p class="search-loading">Зачекайте, йде пошук...</p>
        </div>
      </div>
    </main>

    <footer class="footer"></footer>
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/search.js"></script>
  </body>
</html>
