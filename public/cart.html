<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wolfram Shop</title>
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header"></header>
    <main class="main">
      <aside class="sidebar">
        <div class="cart-box">
          <h3>Корзина</h3>
          <p>Товарів: <span id="cart-count">0</span></p>
          <p>Сума: <span id="cart-total">0</span> грн</p>
          <a href="cart.html">
            <button>Оформити замовлення</button>
          </a>
        </div>

        <div class="catalog">
          <h3>Каталог</h3>
          <ul id="catalog-list"></ul>
        </div>
      </aside>
      <div class="content">
        <section class="cart-section">
          <h1>Ваша корзина</h1>
          <div class="cart-container">
            <table id="cart-table">
              <thead>
                <tr>
                  <th>Товар</th>
                  <th>Виробник</th>
                  <th>Діаметр</th>
                  <th>Вага</th>
                  <th>Ціна</th>
                  <th>Кількість</th>
                  <th>Сума</th>
                  <th>Тип</th>
                  <th>Дія</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="cart-summary">
            <h3>Разом: <span id="cart-page-total">0</span> грн</h3>
            <button class="order-button">Підтвердити замовлення</button>
          </div>
        </section>
      </div>

      <div id="checkout-modal" class="modal hidden">
        <div class="modal-content">
          <span class="close-modal">&times;</span>
          <h2>Оформлення замовлення</h2>
          <form id="checkout-form">
            <div class="form-group">
              <label for="client-name">ПІБ отримувача *</label>
              <input
                type="text"
                id="client-name"
                name="name"
                required
                placeholder="Іванов Іван Іванович"
              />
            </div>

            <div class="form-group">
              <label for="client-phone">Телефон *</label>
              <input type="tel" id="client-phone" name="phone" required placeholder="+380..." />
            </div>

            <div class="form-group">
              <label for="client-email">Email</label>
              <input type="email" id="client-email" name="email" placeholder="taras@example.com" />
            </div>

            <div class="form-group">
              <label for="client-delivery">Місто та відділення (Нова Пошта) *</label>
              <input
                type="text"
                id="client-delivery"
                name="delivery"
                required
                placeholder="м. Київ, відд. №1"
              />
            </div>

            <div class="form-group">
              <label for="client-comment">Коментар до замовлення</label>
              <textarea
                id="client-comment"
                name="comment"
                rows="3"
                placeholder="Додаткові побажання..."
              ></textarea>
            </div>

            <div class="modal-footer">
              <h3>До сплати: <span id="modal-total-price">0</span> грн</h3>
              <button type="submit" class="submit-order-btn">Відправити замовлення</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer class="footer"></footer>

    <script type="module">
      import { injectHeader, injectFooter } from './layouts.js';
      injectHeader();
      injectFooter();
    </script>
    <script type="module" src="script.js"></script>
    <script type="module" src="cart-page.js"></script>
  </body>
</html>
